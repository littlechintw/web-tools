version: 2
updates:
  # npm / pnpm dependencies (Dependabot reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a brand-new release, so a compromised
    # publish is usually caught first. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay on the exact version @huggingface/transformers pins, and the
      # worker's ONNX file selection must be re-checked with it. Bump it by
      # hand together with transformers (see src/tools/whisper-transcribe/worker.ts).
      - dependency-name: onnxruntime-web

  # GitHub Actions are pinned to commit SHAs; Dependabot updates the SHA and
  # the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
