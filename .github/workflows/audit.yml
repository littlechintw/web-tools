name: Dependency audit

# Kept separate from the deploy workflow on purpose: a newly published advisory
# in some unrelated package should alert us, not block shipping an unrelated fix.
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # Reads pnpm-lock.yaml; no install needed. Fails on any known advisory
      # in the production dependency tree.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=low
